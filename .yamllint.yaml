# Run locally: uv tool install yamllint && yamllint .
extends: default

ignore: |
  node_modules/
  pnpm-lock.yaml

rules:
  document-start: disable
  line-length:
    max: 120
  # GitHub Actions uses the `on:` key, which is not a boolean.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
