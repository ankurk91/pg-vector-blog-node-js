services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: blog
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro # creates blog_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d blog"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
