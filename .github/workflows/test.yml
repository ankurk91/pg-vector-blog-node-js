name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: blog_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d blog_test"
          --health-interval 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/blog_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm db:migrate

      - run: pnpm test
